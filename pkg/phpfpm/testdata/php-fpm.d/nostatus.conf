; A pool without a status page. php-fpm replaces each $pool with the name of the pool.
[nostatus]
listen = /run/php-fpm/$pool.sock
pm.status_listen = /run/php-fpm/$pool-status.sock
slowlog = /var/log/$pool/$pool.slow.log
request_slowlog_timeout = 5
php_value[session.save_path] = /var/lib/php/$pool-sessions
